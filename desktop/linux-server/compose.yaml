name: egyuttparkolas
services:
  server:
    image: egyuttparkolas-server:local
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    ports:
      - "${EP_PORT:-8080}:8080/tcp"
    volumes:
      - ./data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 20s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
